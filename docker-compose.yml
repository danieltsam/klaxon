services:
  remotealarm:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remotealarm
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/alarms.db
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
    volumes:
      - ./data:/app/data
      - ./backend/service-account.json:/app/service-account.json:ro
