name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: build release apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: require secrets
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for v in GS KS SP KP KA; do
            if [ -z "${!v}" ]; then
              echo "::error::missing required repository secret ($v). See README/release notes."
              exit 1
            fi
          done

      - name: write google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GS" | base64 -d > mobile/android/app/google-services.json

      - name: write release keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > mobile/android/app/release.keystore

      - name: write key.properties
        env:
          SP: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            echo "storePassword=$SP"
            echo "keyPassword=$KP"
            echo "keyAlias=$KA"
            echo "storeFile=release.keystore"
          } > mobile/android/key.properties

      - name: dependencies
        working-directory: mobile
        run: flutter pub get

      - name: build apk
        working-directory: mobile
        run: flutter build apk --release --build-name="${GITHUB_REF_NAME#v}" --build-number="${{ github.run_number }}"

      - name: stage apk
        run: |
          mkdir -p out
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "out/klaxon-${GITHUB_REF_NAME}.apk"

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/klaxon-*.apk
          generate_release_notes: true
