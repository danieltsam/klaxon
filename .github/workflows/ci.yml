name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  mobile:
    name: mobile analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: dependencies
        working-directory: mobile
        run: flutter pub get
      - name: analyze
        working-directory: mobile
        run: flutter analyze lib/ test/
      - name: test
        working-directory: mobile
        run: flutter test

  clients:
    name: clients tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/package-lock.json
      - run: npm ci
      - run: npm test
      # ray build compiles with esbuild and does not type-check, so a missing or
      # renamed API export only fails at render time inside Raycast.
      - name: raycast typecheck
        run: npm run typecheck -w klaxon
